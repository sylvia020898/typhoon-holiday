<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>body{margin:0}[hidden]{display:none!important}</style>
</head>
<body>
<title>颱風假的科學</title>
<meta name="description" content="2017–2026 年 22 縣市颱風停班停課紀錄、法定風雨標準與決策精準度互動地圖">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Noto+Sans+TC:wght@400;500;700&display=swap">
<style>
/* 版面：整版台灣地圖為主體，右側資訊欄＋直立模組列，底部颱風時間軸（參照 Cuberto map-based timeline，改白底黑灰） */
:root{
  color-scheme: light;
  /* 黑灰白：刻意不用藍、綠、紅、橘等彩色，避免政黨色聯想 */
  --bg:#FFFFFF;            /* 白底 */
  --ink:#2B2B2B;           /* 主文字：炭灰，不用純黑 */
  --muted:#707070;         /* 次要文字 */
  --line:#E6E6E6;          /* 框線 */
  --wash:#F5F5F5;          /* 淡底 */
  --hatch:#C4C4C4;         /* 斜線紋 */
  --mid:#6E6E6E;           /* 中灰：漏放、次強調 */
  /* 點綴色：取彩虹的紅、橙、黃、紫（不用綠、藍），只做裝飾、不承載資料；每個模組一色 */
  --c-red:#E5483F; --c-orange:#F2962B; --c-yellow:#F2C500; --c-purple:#9B4DCA;
  --mod:var(--c-red);
  --rainbow:linear-gradient(90deg,var(--c-red) 0 25%,var(--c-orange) 25% 50%,var(--c-yellow) 50% 75%,var(--c-purple) 75%);
  --accent:#444444;        /* 主色：深灰，最深不到黑 */
  --strong:#1F1F1F;
  --b1:#F0F0F0; --b2:#DCDCDC; --b3:#C3C3C3; --b4:#A4A4A4; --b5:#828282; --b6:#616161; --b7:#444444;
  --f-num:"Barlow Condensed","Noto Sans TC",system-ui,sans-serif;
  --f-body:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.6}
*{box-sizing:border-box}
button,select,input{font:inherit;color:inherit}
a{color:var(--strong)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums;letter-spacing:.01em}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes pulse{0%{box-shadow:0 0 0 3px var(--bg),0 0 0 5px var(--mod)}70%{box-shadow:0 0 0 3px var(--bg),0 0 0 12px rgba(0,0,0,0)}100%{box-shadow:0 0 0 3px var(--bg),0 0 0 5px var(--mod)}}

.app[data-tab=rules]{--mod:var(--c-orange)}.app[data-tab=timing]{--mod:var(--c-yellow)}.app[data-tab=about]{--mod:var(--c-purple)}
.app{position:relative;height:100%;display:grid;grid-template-columns:minmax(0,1fr) 400px 92px;grid-template-rows:auto minmax(0,1fr) auto}
.app::before{content:"";position:absolute;left:0;right:0;top:0;height:4px;background:var(--rainbow);z-index:6}
/* 左上：標題與口徑 */
.top{grid-column:1;grid-row:1;display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px 24px;padding:22px 28px 6px}
.brand h1{margin:0;font-size:26px;font-weight:700;letter-spacing:.04em;text-wrap:balance}
.brand p{margin:2px 0 0;color:var(--muted);font-size:13px}
.ctrl{display:flex;flex-direction:column;gap:4px;min-width:0}.ctrl[hidden]{display:none}
.ctrl label{font-size:11px;letter-spacing:.12em;color:var(--muted)}
.ctrl select{border:1px solid var(--line);border-radius:6px;padding:7px 30px 7px 10px;background:var(--bg);max-width:100%;appearance:none;
  background-image:linear-gradient(45deg,transparent 50%,var(--accent) 50%),linear-gradient(135deg,var(--accent) 50%,transparent 50%);
  background-position:calc(100% - 15px) 52%,calc(100% - 10px) 52%;background-size:5px 5px;background-repeat:no-repeat}
.ctrl select:hover{border-color:var(--b4)}

/* 地圖 */
.map{grid-column:1;grid-row:2;position:relative;min-height:0;padding:4px 20px 0}
.map svg{width:100%;height:100%;display:block}
.map path.c{stroke:#FFFFFF;stroke-width:1.1;cursor:pointer;transition:fill .5s ease,stroke .3s,stroke-width .2s}
.map path.c:hover,.map path.c.hl{stroke:var(--mod);stroke-width:2.2}
.map path.c.sel{stroke:var(--mod);stroke-width:2.6}
.map.intro path.c{fill:#FFFFFF!important;stroke:var(--mod);stroke-dasharray:var(--L);stroke-dashoffset:var(--L);animation:draw 1.1s ease forwards;animation-delay:calc(var(--i)*14ms)}
.map .inset{fill:none;stroke:var(--b3);stroke-dasharray:4 4}
.map text{font-family:var(--f-body);pointer-events:none}
.map .lbl{font-size:13px;fill:var(--ink);paint-order:stroke;stroke:#FFFFFF;stroke-width:3px;font-weight:500}
.map .lbl.on{fill:#FFFFFF;stroke:var(--strong)}
.map .ilbl{font-size:11px;fill:var(--muted)}
.legend{position:absolute;right:24px;bottom:12px;display:flex;flex-direction:column;gap:6px;background:rgba(255,255,255,.92);padding:10px 12px;border:1px solid var(--line);border-radius:8px;font-size:12px;max-width:220px}
.legend .t{font-size:11px;letter-spacing:.1em;color:var(--muted)}
.legend .row{display:flex;align-items:center;gap:8px}
.legend i{width:14px;height:14px;border-radius:3px;display:inline-block;flex:none;border:1px solid var(--line)}
.legend .ramp{display:flex;gap:2px}.legend .ramp i{width:22px;border:0}
.legend .ends{display:flex;justify-content:space-between;color:var(--muted)}
/* 左下海面：颱風氣旋模擬（Canvas 程式繪製，隨選中的颱風換大小與轉速） */
.cyc{position:absolute;left:16px;bottom:10px;width:min(210px,26vh);display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer;user-select:none}
.cyc canvas{width:100%;aspect-ratio:1;height:auto;display:block}
.cyc .n{font-size:12px;color:var(--muted);text-align:center;line-height:1.4}
.cyc .n b{color:var(--ink);font-weight:500}
.cyc:hover .n b{color:var(--mod)}
@media (max-width:1100px){.cyc{width:min(170px,24vh)}}
.tip{position:absolute;pointer-events:none;background:var(--ink);color:#FFFFFF;padding:6px 10px;border-radius:6px;font-size:12px;white-space:nowrap;transform:translate(-50%,-120%);opacity:0;transition:opacity .15s}

/* 底部時間軸 */
.tl{grid-column:1;grid-row:3;padding:6px 28px 18px;border-top:1px solid var(--line);min-width:0}
.tl-head{display:flex;align-items:center;gap:10px;margin:6px 0 2px;font-size:12px;color:var(--muted)}
.tl-head button{white-space:nowrap;flex:none;border:1px solid var(--line);background:var(--bg);border-radius:999px;padding:2px 12px;cursor:pointer}
.tl-head button.on{background:var(--bg);border-color:var(--mod);color:var(--ink);box-shadow:inset 0 0 0 1px var(--mod)}
.tl-scroll{overflow-x:auto}
.tl-track{display:flex;min-width:640px}
.yr{flex:1;position:relative;height:74px;border-left:1px solid var(--line)}
.yr:last-child{border-right:1px solid var(--line)}
.yr .dots{position:absolute;left:0;right:0;top:8px;height:36px}
.yr button.y{position:absolute;left:0;right:0;bottom:0;height:26px;border:0;background:none;cursor:pointer;font-family:var(--f-num);font-size:15px;font-weight:600;color:var(--muted);letter-spacing:.06em}
.yr button.y:hover{color:var(--ink)}
.yr.on{background:linear-gradient(var(--b1),var(--b1))}
.yr.on button.y{color:var(--strong)}
.yr.on::after{content:"";position:absolute;left:0;right:0;bottom:0;height:4px;background:var(--mod)}
.dot{position:absolute;top:50%;transform:translate(-50%,-50%);border-radius:50%;border:2px solid var(--b4);background:var(--bg);cursor:pointer;padding:0;transition:transform .2s,border-color .2s,background .2s}
.dot.hit{background:rgba(68,68,68,.42);border-color:transparent}
.dot.on{box-shadow:0 0 0 3px var(--bg),0 0 0 5px var(--mod);animation:pulse 1.8s ease-out infinite}
.dot:hover{transform:translate(-50%,-50%) scale(1.18);border-color:var(--mod);background:rgba(68,68,68,.6)}

/* 右側資訊欄 */
.panel{grid-column:2;grid-row:1/4;border-left:1px solid var(--line);overflow-y:auto;padding:28px 26px 40px;min-width:0}
.panel.anim>*{animation:rise .45s cubic-bezier(.2,.7,.2,1) both;animation-delay:calc(var(--i,0)*35ms)}
.eyebrow{font-size:12px;letter-spacing:.14em;color:var(--strong);font-weight:500;display:flex;align-items:center;gap:8px}
.eyebrow::before{content:"";width:22px;height:4px;border-radius:2px;background:var(--mod);flex:none}
.big{font-family:var(--f-num);font-weight:600;font-size:60px;line-height:1;margin:6px 0 4px;letter-spacing:.01em;color:var(--strong)}
.big small{font-size:22px;font-weight:600;color:var(--muted);margin-left:6px}
.lede{color:var(--muted);margin:6px 0 0;font-size:13.5px}
.panel h3{font-size:13px;letter-spacing:.1em;color:var(--muted);font-weight:500;margin:26px 0 10px;padding-bottom:6px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:8px}
.panel h3 span{letter-spacing:0;color:var(--muted)}
.bars{display:flex;flex-direction:column;gap:1px;font-size:12.5px}
.bars button{all:unset;cursor:pointer;display:grid;grid-template-columns:56px minmax(0,1fr) 30px;gap:8px;align-items:center;padding:2px 6px;margin:0 -6px;border-radius:5px;transition:background .15s}
.bars button:hover,.bars button.hover{background:var(--wash)}
.bars button:focus-visible{outline:2px solid var(--mod);outline-offset:0}
.bars .n{text-align:right;font-family:var(--f-num);font-size:15px;font-weight:600}
.bars .bar{height:12px;background:var(--wash);border-radius:2px;overflow:hidden}
.bars .bar b{display:block;height:100%;background:var(--b6);transform-origin:left;animation:grow .7s cubic-bezier(.2,.7,.2,1) both;animation-delay:calc(var(--i,0)*25ms);transition:background .2s}
.bars button:hover .bar b,.bars button.hover .bar b,.bars .sel .bar b{background:var(--mod)}
.bars .sel .nm,.bars .sel .n{color:var(--strong);font-weight:700}
.heat{display:grid;grid-template-columns:44px repeat(10,minmax(0,1fr));gap:2px;font-size:11px}
.heat .h{color:var(--muted);text-align:center;font-family:var(--f-num);font-size:12px}
.heat .r{color:var(--ink);white-space:nowrap}
.heat .c{aspect-ratio:1.3;border-radius:2px;display:flex;align-items:center;justify-content:center;font-family:var(--f-num);font-size:12px;cursor:pointer;transition:transform .15s,box-shadow .15s}
.heat .c:hover{transform:scale(1.18);box-shadow:0 0 0 2px var(--mod);position:relative;z-index:1}
.list{display:flex;flex-direction:column}
.item{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:4px 10px;padding:10px 0;border-bottom:1px solid var(--line);align-items:start}
.item.sel{background:var(--b1);box-shadow:inset 3px 0 0 var(--mod);padding-left:8px;margin-left:-8px}
.item.btn{cursor:pointer;transition:background .15s,padding-left .15s}.item.btn:hover{background:var(--wash);padding-left:6px;box-shadow:inset 3px 0 0 var(--mod)}
.item .d{font-family:var(--f-num);font-size:16px;font-weight:600;white-space:nowrap}
.item .x{font-size:12.5px;color:var(--muted);grid-column:2/4;min-width:0;overflow-wrap:anywhere}
.item .x a{font-size:12px}
.pill{display:inline-block;font-size:11.5px;padding:1px 8px;border-radius:999px;white-space:nowrap;border:1px solid transparent}
.p4{background:var(--accent);color:#FFFFFF}.p3{background:var(--b4);color:#FFFFFF}.p2{background:var(--b2);color:var(--strong)}
.p1{background:var(--bg);color:var(--strong);border-color:var(--b3);border-style:dashed}.p0{background:var(--wash);color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--bg);border-radius:6px;padding:4px 10px;cursor:pointer;font-size:12.5px;display:flex;flex-direction:column;align-items:flex-start;line-height:1.3}
.chip .num{font-size:16px;font-weight:600}
.chip small{color:var(--muted);font-size:11px}
.chip.on{border-color:var(--accent);background:var(--b1);box-shadow:inset 0 -3px 0 0 transparent;background-image:linear-gradient(var(--mod),var(--mod));background-size:100% 3px;background-repeat:no-repeat;background-position:bottom}
.chip{transition:transform .15s,border-color .15s}.chip:hover{border-color:var(--mod);transform:translateY(-1px)}
.play{border:1px solid var(--line);background:var(--bg);border-radius:999px;padding:2px 10px;cursor:pointer;font-size:12px;color:var(--ink);transition:border-color .15s}
.play:hover,.play.on{border-color:var(--mod);box-shadow:inset 0 0 0 1px var(--mod)}
.meta{display:grid;grid-template-columns:auto 1fr;gap:2px 14px;font-size:12.5px;margin-top:12px}
.meta dt{color:var(--muted)}.meta dd{margin:0}
.note{font-size:12px;color:var(--muted);background:var(--wash);border-radius:8px;padding:10px 12px;margin-top:12px}
.note b{color:var(--ink);font-weight:500}

/* 四格矩陣 */
.mx{display:grid;grid-template-columns:40px 1fr 1fr 1fr;gap:4px;font-size:12px}
.mx .hd{color:var(--muted);text-align:center;align-self:end}
.mx .sd{color:var(--muted);writing-mode:vertical-rl;justify-self:center;align-self:center}
.cell{border-radius:6px;padding:10px;display:flex;flex-direction:column;gap:2px;cursor:pointer;border:2px solid transparent;transition:transform .15s,border-color .15s}
.cell:hover{transform:translateY(-2px);border-color:var(--mod)}
.cell .num{font-size:26px;font-weight:700;line-height:1}
.cell{padding:8px 6px;font-size:11.5px}
.cell.on{border-color:var(--mod)}
.c-ym{background:var(--accent);color:#FFFFFF}.c-nn{background:var(--b1);color:var(--strong)}
.c-yu,.c-nu{background:var(--wash);color:var(--muted);border:2px dashed var(--b3)}
.c-yn{background:repeating-linear-gradient(135deg,var(--bg) 0 5px,var(--hatch) 5px 7px);color:var(--ink);border-color:var(--ink)}.c-nm{background:var(--mid);color:#FFFFFF}
.cmp{display:grid;grid-template-columns:110px minmax(0,1fr) 46px;gap:6px 8px;align-items:center;font-size:12px}
.cmp .bar{height:10px;background:var(--wash);border-radius:2px;overflow:hidden}.cmp .bar b{display:block;height:100%}
.stack{display:flex;height:14px;border-radius:3px;overflow:hidden;margin:6px 0}
.stack i{display:block;height:100%}

/* 規則檢查器 */
.form{display:grid;grid-template-columns:1fr 1fr;gap:10px 12px}
.form .f{display:flex;flex-direction:column;gap:3px;min-width:0}
.form .f.w{grid-column:1/3}
.form label{font-size:12px;color:var(--muted)}
.form input,.form select{border:1px solid var(--line);border-radius:6px;padding:7px 9px;background:var(--bg);width:100%}
.verdict{margin-top:14px;border-radius:10px;padding:14px 16px;border:1px solid var(--line)}
.verdict .s{font-weight:700;font-size:16px}
.v-a{background:var(--accent);color:#FFFFFF;border-color:var(--accent)}
.v-b{background:var(--b1);color:var(--strong);border-color:var(--b3)}
.v-c{background:var(--wash);color:var(--ink)}
.gauge{height:8px;background:rgba(255,255,255,.35);border-radius:4px;margin-top:8px;overflow:hidden;position:relative}
.v-b .gauge,.v-c .gauge{background:var(--line)}
.gauge b{display:block;height:100%;background:currentColor}
table.t{width:100%;border-collapse:collapse;font-size:12.5px}
table.t th,table.t td{text-align:left;padding:5px 6px;border-bottom:1px solid var(--line)}
table.t th{color:var(--muted);font-weight:500;font-size:11.5px}
table.t td.num{font-size:15px}
table.t tr.hi td{background:var(--b1);color:var(--strong);font-weight:500}
table.t tr.cl{cursor:pointer}table.t tr.cl:hover td{background:var(--wash)}
.tw{overflow-x:auto}

/* 右側直立模組列 */
.rail{grid-column:3;grid-row:1/4;border-left:1px solid var(--line);display:flex;flex-direction:column;background:var(--bg)}
.rail .logo{height:86px;display:flex;align-items:center;justify-content:center;border-bottom:1px solid var(--line)}
.rail button{all:unset;cursor:pointer;height:96px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;border-bottom:1px solid var(--line);font-size:12px;color:var(--muted);text-align:center;line-height:1.3}
.rail button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.6;transition:transform .2s}
.rail button:hover svg{transform:translateY(-2px)}
.rail button:hover{color:var(--ink);background:var(--wash)}
.rail button{position:relative}
.rail button.on{background:var(--wash);color:var(--strong);font-weight:500}
.rail button.on svg{stroke:var(--mod)}
.rail button.on::before{content:"";position:absolute;left:0;top:0;bottom:0;width:5px;background:var(--mod)}
.rail button:focus-visible{outline:2px solid var(--ink);outline-offset:-4px}
.foot{font-size:11.5px;color:var(--muted);margin-top:30px;padding-top:12px;border-top:1px solid var(--line)}

@media (max-width:1100px){.app{grid-template-columns:minmax(0,1fr) 340px 76px}.rail button{height:84px;font-size:11px}}
@media (max-width:860px){
  .rail button.on::before{left:0;right:0;top:auto;bottom:0;width:auto;height:4px}
  .app::before{position:sticky;display:block}
  html,body{height:auto}
  .app{display:flex;flex-direction:column;height:auto}
  .rail{order:1;flex-direction:row;border-left:0;border-bottom:1px solid var(--line);position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
  .rail .logo{display:none}
  .rail button{flex:1;height:58px;border-bottom:0;border-right:1px solid var(--line);font-size:11px;gap:2px}
  .rail button svg{width:18px;height:18px}
  .top{order:2;padding:16px 16px 4px}
  .map{order:3;padding:0 8px}
  .map svg{height:min(118vw,620px)}
  .legend{position:static;max-width:none;margin:4px 8px 0}
  .cyc{left:12px;bottom:12px;width:120px}.cyc .n{font-size:11px}
  .tl{order:4;padding:6px 16px 12px}
  .panel{order:5;border-left:0;border-top:1px solid var(--line);padding:20px 16px 40px;overflow:visible}
  .big{font-size:48px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<div class="app" id="app">
  <header class="top">
    <div class="brand">
      <h1>颱風假的科學</h1>
      <p><span class="num">2017–2026</span> · 22 縣市停班停課、法定標準與決策精準度</p>
    </div>
    <div class="ctrl" id="levelCtrl">
      <label for="level">「放假」怎麼算</label>
      <select id="level">
        <option value="4">全縣市全日停班停課</option>
        <option value="3">＋ 只停課不停班</option>
        <option value="2">＋ 半日、中午起、晚間停</option>
        <option value="1">＋ 部分區域或個別學校停</option>
      </select>
    </div>
  </header>

  <div class="map" id="map"><div class="tip" id="tip"></div><div class="legend" id="legend"></div>
    <div class="cyc" id="cyc" title="點一下：有選颱風就逐日播放，沒有就跳到近台風速最強的一場" role="button" tabindex="0"><canvas id="cycv" width="420" height="420" aria-hidden="true"></canvas><div class="n" id="cycn"></div></div></div>

  <section class="tl" id="tl" aria-label="颱風時間軸">
    <div class="tl-head"><button id="tlAll" type="button">十年總覽</button><span id="tlHint">點年份看單年，點圓點看單一颱風；實心圓＝至少一縣市全日停班停課</span></div>
    <div class="tl-scroll"><div class="tl-track" id="track"></div></div>
  </section>

const addDays=(iso,n)=>{const [y,m,d]=iso.split('-').map(Number);const t=new Date(y,m-1,d+n);return `${t.getFullYear()}-${String(t.getMonth()+1).padStart(2,'0')}-${String(t.getDate()).padStart(2,'0')}`};

function evaluate(){
  const cases=[]; let noObs=0, excluded=0;
  EVENTS.forEach(ids=>{
    const t=T[ids[0]];
    for(let c=0;c<C.length;c++){
      const rows=DAYS.filter(r=>ids.includes(r.t)&&r.c===c);
      const listed=rows.length>0&&rows.some(r=>r.warn);
      if(S.denom!=='all'&&!listed){excluded++;continue}
      const os=ids.map(i=>(D.obs[i]||{})[c]).filter(o=>o&&o[3]!=null);
      if(!os.length){noObs++;continue}
      const st=os[0][0], wind=os.reduce((a,o)=>mx(a,o[1]),null), gust=os.reduce((a,o)=>mx(a,o[2]),null), rain=os.reduce((a,o)=>mx(a,o[3]),null);
      const dayRain=os.some(o=>o[4]), backup=os.some(o=>!o[5]);
      const v=versionAt(t.start.slice(0,10)), th=v.table[C[c]];
      const rainThr=th[2]??th[0];
      const w=wind!=null&&wind>=13.9, g=gust!=null&&gust>=24.5, r=rain>=rainThr;
      const met=w||g||r;
      const miss=[wind==null?'平均風':null,gust==null?'陣風':null,dayRain?'連續 24 小時雨量（只有日雨量）':null].filter(Boolean);
      const obsK=met?'m':miss.length?'u':'n';
      const maxcat=rows.length?Math.max(...rows.map(x=>x.cat)):0;
      const dec=maxcat>=S.level;
      cases.push({ti:ids[0],ids,c,dec,maxcat,obsK,listed,st,backup,wind,gust,rain,rainThr,w,g,r,miss,k:(dec?'y':'n')+obsK});
    }

  return {cases,noObs,excluded};
}

    <div class="note" style="margin-top:10px"><b>這是事後實測對照，不是決策對錯或合法性判斷。</b>法規第 4 條看的是預報、且限暴風半徑 4 小時內可能經過的地區；雨量款另需致災之虞；第 3 款還有交通、水電等事由。這裡一縣市只用一個平地測站，整場事件只看極值、不分日。</div>
    <div class="chips" style="margin-top:10px">
      <button type="button" class="chip ${S.denom!=='all'?'on':''}" onclick="S.denom='listed';render()"><span class="num">只算快照有公告的縣市</span><small>預設 · 排除 ${excluded} 組</small></button>
      <button type="button" class="chip ${S.denom==='all'?'on':''}" onclick="S.denom='all';render()"><span class="num">22 縣市全納入</span><small>沒公告視為沒放</small></button>
      ${cty!=null?`<button type="button" class="chip on" onclick="pickCounty(${cty})"><span class="num">✕ ${C[cty]}</span><small>回到全部縣市</small></button>`:''}</div>
    ${cty==null?`<p class="lede" style="margin-top:6px">點地圖上的縣市，右欄只看該縣市。</p>`:''}
    <h3>決定 × 實測<span>點格子看個案</span></h3>
    <div class="mx"><span></span><span class="hd">實測達標</span><span class="hd">實測未達</span><span class="hd">無法判定</span>
      <span class="sd">有放</span>${cell('ym')}${cell('yn')}${cell('yu')}
      <span class="sd">沒放</span>${cell('nm')}${cell('nn')}${cell('nu')}</div>
    <p class="lede" style="font-size:12px">「有放」＝${LEVELN[S.level]}；「無法判定」＝已知值未達，但平均風或陣風缺測（自動站沒有陣風）、或資料庫只有日雨量。達標＝平均風 ≥ 13.9 m/s 或陣風 ≥ 24.5 m/s 或 24 小時雨量 ≥ 該縣市當時附表值。</p>
    <h3>和既有研究比<span>分母定義相反，只能看量級</span></h3>
    <div class="cmp">
      ${cty!=null?`<span>本工具 · ${C[cty]}</span><span class="bar"><b style="width:${K.acc*100}%;background:var(--mod)"></b></span><span class="num">${pctf(K.acc)}</span>`:''}
      <span>本工具 2017–26${cty!=null?' · 全部':''}<br><small style="color:var(--muted)">${S.denom==='all'?'22 縣市全納入':'有公告的縣市'}</small></span><span class="bar"><b style="width:${KA.acc*100}%;background:var(--accent)"></b></span><span class="num">${pctf(KA.acc)}</span>
      <span>陳智昆 2010–18<br><small style="color:var(--muted)">決策符合風雨標準</small></span><span class="bar"><b style="width:77.8%;background:var(--b4)"></b></span><span class="num">77.8%</span>
      <span>陳智昆 2010–18<br><small style="color:var(--muted)">純氣象模型預測</small></span><span class="bar"><b style="width:84%;background:var(--b3)"></b></span><span class="num">84.0%</span></div>
    <div class="note">陳智昆（2024），《公共行政學報》第 66 期，頁 43–82：28 個颱風、1,840 件縣市決策，單位是「陸上警報日 × 全部縣市」，風雨用縣市內各站匯總；本工具預設只算有公告的縣市、每縣市一站。切到「22 縣市全納入」才接近它的分母。</div>
    <h3>${cty!=null?C[cty]+' ':''}${S.cell?cellN[S.cell]:'決定與實測不相符'}的個案<span>${sel.length} 件</span></h3><div class="list">`+
    (sel.length?'':`<p class="lede">沒有符合的個案。</p>`)+
    sel.slice(0,60).map(x=>{const t=T[x.ti];return `<div class="item btn" role="button" tabindex="0" onclick="S.county=${x.c};pickTyphoon(${x.ti})">
      <span class="d" style="font-family:var(--f-body);font-size:14px">${C[x.c]}</span><span>${x.ids.map(i=>esc(T[i].name)).join('＋')} <span class="num" style="color:var(--muted)">${t.start.slice(0,4)}</span></span><span class="pill ${x.dec?'p4':x.maxcat?'p'+x.maxcat:'p0'}">${x.dec?LEVELN[S.level].slice(0,6):x.listed?CATN[x.maxcat]:'無公告'}</span>
      <span class="x">${esc(x.st)}站${x.backup?'<span class="pill p1" style="margin-left:4px">備援站</span>':''}：平均風 <b class="num" style="color:${x.w?'var(--strong)':'inherit'}">${x.wind??'—'}</b> m/s、陣風 <b class="num" style="color:${x.g?'var(--strong)':'inherit'}">${x.gust??'—'}</b> m/s、24 小時雨量 <b class="num" style="color:${x.r?'var(--strong)':'inherit'}">${x.rain}</b> / ${x.rainThr} mm${x.miss.length&&!x.w&&!x.g&&!x.r?`　缺：${x.miss.join('、')}`:''}</span></div>`}).join('')+
    (sel.length>60?`<p class="lede">只列前 60 件。</p>`:'')+`</div>
    <h3>前一天的快照怎麼說<span>${cty!=null?C[cty]+' ':''}全日停班停課 ${fullDays.length} 天</span></h3>
    <div class="stack" aria-hidden="true"><i style="width:${evF/FD*100}%;background:var(--accent)"></i><i style="width:${evO/FD*100}%;background:var(--b4)"></i><i style="width:${sil/FD*100}%;background:var(--mid)"></i><i style="width:${unk/FD*100}%;background:var(--line)"></i></div>
    <dl class="meta"><dt><span class="pill p4">已寫「明天全日停」</span></dt><dd class="num">${evF} 天</dd>
      <dt><span class="pill p3">寫的是其他決定</span></dt><dd class="num">${evO} 天<small style="color:var(--muted)">（當天才升級為全日停）</small></dd>
      <dt><span class="pill" style="background:var(--mid);color:#FFFFFF">22 時後仍無該縣市明天公告</span></dt><dd class="num">${sil} 天</dd>
      <dt><span class="pill p0">快照無法判定</span></dt><dd class="num">${unk} 天<small style="color:var(--muted)">（前一日無快照、存檔早於公告、或版型沒有「明天」行）</small></dd></dl>
    <div class="note">人事總處的快照是存檔當時的頁面複本，不是當天最後狀態；「無法判定」不代表沒有前一晚公布。要研究首次公告時間，得另外蒐集公告時間戳。</div>
    <h3>前一晚和當天不一樣<span>${LEVELN[S.level]}口徑 ${changes.length} 件</span></h3><div class="list">`+changes.map(r=>`
      <div class="item btn" role="button" tabindex="0" onclick="S.county=${r.c};pickTyphoon(${r.t});S.day='${r.date}';render()"><span class="d">${md(r.date)}</span><span>${C[r.c]} · ${esc(T[r.t].name)}</span><span></span>
      <span class="x"><span class="pill p${r.eveCat}">${CATN[r.eveCat]}</span> → <span class="pill p${r.cat}">${CATN[r.cat]}</span></span></div>`).join('')+`</div>
    <div class="note"><b>下一步：時間窗 A、B。</b>目前的實測是整場事件的極值（含消散後兩天），等於事後評判基準。用 CODiS 逐時觀測重建「前一晚 18–22 時」與「當天 0–4 時」能掌握的風雨，才能比較兩個決策窗的資訊差。${noObs?`另有 ${noObs} 場因代表站缺測未列入。`:''}</div>`;
  h+=foot(); $('#panel').innerHTML=h;
}

/* ---------- 資料說明 ---------- */
function renderAbout(){
  const counts=holidaysByCounty(()=>true), max=Math.max(...counts);
  paint(i=>rampColor(counts[i],max),i=>({text:short(C[i])}),i=>`${C[i]}　${counts[i]} 天`,`<span class="t">十年${LEVELN[S.level]}天數</span><div class="ramp">${RAMP.map(c=>`<i style="background:${c}"></i>`).join('')}</div><div class="ends num"><span>1</span><span>${max}</span></div>`);
  $('#panel').innerHTML=`<div class="eyebrow">資料說明</div><div class="big">怎麼算的</div>
  <h3>停班停課紀錄</h3><p class="lede" style="margin:0">來源：行政院人事行政總處「歷次天然災害停止上班上課訊息」2017–2026 年共 308 份每日快照，每份是存檔當時頁面的複本，列出當時有公告的縣市的「今天／明天」原文（2019-08 之前把未列警戒區的縣市也寫成「照常」，之後改寫「尚未列入警戒區」；2026 年的存檔沒有「明天」行）。同一縣市同一天以當天快照的「今天」為準，沒有才用前一天快照的「明天」。與臺北、高雄、臺南、桃園、臺中市政府開放資料逐日比對：兩邊都列出的日子，日期與等級全部一致（臺北 22/22、高雄 70/70、臺南 9/9、桃園 33/33、臺中 25/25）；差異只在一方沒收錄的分區／個別學校日與寒流日。</p>
  <h3>「放假」的口徑</h3><dl class="meta">
    <dt><span class="pill p4">全日停班停課</span></dt><dd>全縣市整天停止上班上課（預設）</dd>
    <dt><span class="pill p3">只停課</span></dt><dd>全縣市照常上班、停止上課</dd>
    <dt><span class="pill p2">半日</span></dt><dd>上午、下午、中午起或晚間起停止</dd>
    <dt><span class="pill p1">部分區域</span></dt><dd>只有特定鄉鎮區、村里或學校停止</dd></dl>
  <h3>颱風歸屬</h3><p class="lede" style="margin:0">日期落在氣象署該颱風海上警報發布日至解除隔天之間才算；兩個颱風警報重疊的日子（2017-07-30 尼莎／海棠），歸給前一晚 22 時仍在警報中的颱風，因為停班停課是前一晚決定的。不在任何警報期間的全日停班停課十年共 ${D.nonTyphoonDays} 個縣市日，不列入：其中 8 筆是警報解除 2–3 天後的殘餘降雨（2021 盧碧 7、2019 利奇馬 1）、13 筆是未發警報的颱風外圍環流（2025 竹節草、風神，2026 米克拉）、3 筆花蓮地震、其餘是梅雨與西南氣流豪雨。</p>
  <h3>決定 × 實測怎麼對照</h3><p class="lede" style="margin:0">單位是「事件 × 縣市」（警報重疊的颱風合併為一個事件）。預設只算快照曾列出、且不是整場都標「尚未列入警戒區」的縣市（排除 438 組）；可切換成 22 縣市全納入。實測取氣象署颱風資料庫各測站極值（警報期間＋消散後兩天），每縣市一個平地代表站：署屬氣象站優先，沒有則用縣治所在的自動站；2023–2024 的颱風資料庫測站較少，南投、嘉義縣、新竹市有 10 場改用備援站（個案列會標「備援站」）。達標＝平均風 ≥ 13.9 m/s（7 級）或陣風 ≥ 24.5 m/s（10 級）或 24 小時雨量 ≥ 該縣市當時附表值（有實際觀測替代值者用替代值）；已知值未達、但平均風或陣風缺測（自動站沒有陣風）或資料庫只有日雨量（2017 谷超、海棠，2020 黃蜂、巴威）者列為「無法判定」，不計入吻合率。日雨量與連續 24 小時雨量統計窗不同，不能互相推論。</p>
  <h3>已知限制</h3><ul class="lede" style="padding-left:18px;margin:0">
    <li>資料截至 <span class="num">${D.lastDate}</span>，2026 年尚未結束。</li>
    <li>法規看的是<b>預報</b>，這裡用的是<b>實測</b>；兩者落差本身就是研究題目。吻合率不是決策對錯或合法性的判斷。</li>
    <li>一縣市一站會低估山區風雨，雙標準縣市只對照平地值。</li>
    <li>雨量款還要「致災之虞」，實測達標不等於法定事由成立。</li>
    <li>氣象署沒有公開歷史分縣市風雨預報列表存檔，暫無法還原決策當下的預報。</li>
    <li>2026 年基隆市門檻改為 200 mm 有條文依據；「基隆分區判定」在中央辦法查無依據，它是基隆市政府 2026 年 3 月自訂的判斷基準補充規範，法源是第 9 條授權區長。</li></ul>
  <h3>資料來源</h3><ul class="lede" style="padding-left:18px;margin:0">
    <li><a href="https://www.dgpa.gov.tw/informationlist?uid=374" target="_blank" rel="noopener">人事行政總處：歷次天然災害停止上班上課訊息</a></li>
    <li><a href="https://rdc28.cwa.gov.tw/TDB/" target="_blank" rel="noopener">中央氣象署颱風資料庫</a>（警報颱風清單、測站極值）</li>
    <li><a href="https://law.moj.gov.tw/LawClass/LawHistory.aspx?pcode=S0110022" target="_blank" rel="noopener">全國法規資料庫：天然災害停止上班及上課作業辦法沿革</a></li>
    <li>縣市界：內政部國土測繪中心，經 taiwan-atlas（MIT）簡化</li></ul>
  ${foot()}`;
}
function foot(){return `<div class="foot">資料更新：<span class="num">${D.built}</span>（快照截至 <span class="num">${D.lastDate}</span>）　·　停班停課：人事行政總處　·　風雨實測：中央氣象署　·　門檻：全國法規資料庫</div>`}

function render(){
  $('#app').dataset.tab=S.tab;
  document.querySelectorAll('.rail button').forEach(b=>b.classList.toggle('on',b.dataset.tab===S.tab));
  $('#level').value=S.level;
  $('#levelCtrl').hidden=S.tab==='rules';
  if(S.play&&(S.tab!=='history'||S.scope!=='typhoon')) stopPlay();
  ({history:renderHistory,rules:renderRules,timing:renderTiming,about:renderAbout})[S.tab]();
  const P=$('#panel'), quiet=S.quiet||S.tab==='rules'&&P.dataset.last==='rules';   // 試算輸入時不閃
  P.classList.toggle('anim',!quiet&&!REDUCED);
  if(!quiet){[...P.children].forEach((el,i)=>el.style.setProperty('--i',Math.min(i,10)));countUp(P)}
  const anchor=P.querySelector('[data-anchor]');                       // 左邊點縣市 → 右欄對應該縣市
  if(anchor&&S.jump){anchor.scrollIntoView({behavior:REDUCED?'auto':'smooth',block:'center'})}
  S.jump=false;
  P.dataset.last=S.tab; S.quiet=false;
  syncTimeline(); cycParams();
}
document.addEventListener('keydown',e=>{const el=e.target.closest&&e.target.closest('[role=button]');if(el&&(e.key==='Enter'||e.key===' ')&&!el.matches('button,a')){e.preventDefault();el.click()}});
buildMap(); buildTimeline(); buildCyclone(); render();
</script>
